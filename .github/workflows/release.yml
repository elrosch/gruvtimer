name: Release

# Publishing a GitHub Release with a tag like v1.2.3 builds an APK with that
# version and attaches it to the release. (The server image for the tag is built
# by server-image.yml.)
on:
  release:
    types: [published]

permissions:
  contents: write

env:
  NODE_VERSION: 22

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      # v1.2.3 → versionName 1.2.3, versionCode 1002003. The code grows with
      # every higher version, so Android installs releases as updates.
      - name: Derive version from tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' must look like v1.2.3 (optionally v1.2.3-beta.1)"
            exit 1
          fi
          MAJOR=${BASH_REMATCH[1]} MINOR=${BASH_REMATCH[2]} PATCH=${BASH_REMATCH[3]}
          if (( MINOR > 999 || PATCH > 999 )); then
            echo "::error::Minor and patch version must be below 1000"
            exit 1
          fi
          CODE=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION ($CODE)"

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      # Optional: without these secrets the APK is signed with the debug key.
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          cat > android/key.properties <<PROPS
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/gruvtimer-$TAG.apk"
          gh release upload "$TAG" dist/*.apk --clobber --repo "$GITHUB_REPOSITORY"
