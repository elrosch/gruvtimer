# PocketBase sync backend for gruvtimer (also serves the web app on /).
# Image built by GitHub Actions (server-image.yml); or build it yourself with
#   docker build -f server/Dockerfile -t ghcr.io/elrosch/gruvtimer-pocketbase .
# First start: open the installer link from the container logs to create the superuser,
# or set PB_ADMIN_EMAIL / PB_ADMIN_PASSWORD.

services:
  pocketbase:
    image: ghcr.io/elrosch/gruvtimer-pocketbase:latest
    container_name: gruvtimer-pocketbase
    restart: unless-stopped
    ports:
      # 8090 is usually taken by casa-pazza's PocketBase
      - "8091:8090"
    volumes:
      - pb_data:/pb_data

volumes:
  pb_data:
